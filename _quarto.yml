project:
  type: website
  output-dir: _site

  render:
    - index.qmd
    - reports/m0.qmd

  execute-dir: file

website:
  title: "Hindsight"
  description: "Detecção de sinal point-in-time sobre o sistema de eventos adversos do FDA"

  navbar:
    left:
      - text: "M0 — Esqueleto ambulante"
        href: reports/m0.qmd
    right:
      - icon: github
        href: https://github.com/henriquepmartins/hindsight
        aria-label: "Código no GitHub"

  page-footer:
    border: true
    center: |
      **Não é orientação médica.** Construído a partir dos relatos públicos de
      eventos adversos do FDA; reporte desproporcional não é causalidade.

lang: pt-BR

format:
  html:
    theme: cosmo
    toc: false
    fig-align: center
    link-external-newwindow: true
