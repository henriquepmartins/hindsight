[project]
name = "hindsight"
version = "0.1.0"
description = "Point-in-time signal detection over the FDA Adverse Event Reporting System"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
# Dependencies are pinned in T2 — deliberately empty here so T1 is structure only.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hindsight"]
