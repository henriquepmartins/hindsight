[project]
name = "hindsight"
version = "0.1.0"
description = "Point-in-time signal detection over the FDA Adverse Event Reporting System"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
# polars is deliberately absent (design.md): pyarrow writes the Parquet and
# DuckDB queries it. Add it when a transform actually wants a dataframe.
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "ijson>=3.5.1",
    "pyarrow>=25.0.1",
]

[project.scripts]
hindsight = "hindsight.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hindsight"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is the one CI can afford: no network, no partition on disk.
# `-m slow` on the command line overrides this and selects the other half.
addopts = "-m 'not slow'"
markers = [
    "slow: needs the 155 MB partition and a completed ingest. Local only — CI runs the committed fixture instead (T11)",
]
