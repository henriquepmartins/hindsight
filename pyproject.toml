[project]
name = "hindsight"
version = "0.1.0"
description = "Point-in-time signal detection over the FDA Adverse Event Reporting System"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
# polars is deliberately absent (design.md): pyarrow writes the Parquet and
# DuckDB queries it. Add it when a transform actually wants a dataframe.
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "ijson>=3.5.1",
    "pyarrow>=25.0.1",
]

[project.scripts]
hindsight = "hindsight.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hindsight"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Charts only (AD-015). Deliberately not in `dependencies`: the pipeline never
# imports any of it, so CI's test run must not pay for it. Only the render
# workflow asks for this group. pandas arrives as seaborn's own dependency.
viz = [
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "jupyter>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is the one CI can afford: no network, no partition on disk.
# `-m slow` on the command line overrides this and selects the other half.
addopts = "-m 'not slow'"
markers = [
    "slow: precisa dos zips e de uma ingestao completa. Roda uma vez por particao em PARTITION, ou por todas as ingeridas quando PARTITION nao esta definida. Local — a CI roda o fixture versionado no lugar (T11)",
]
