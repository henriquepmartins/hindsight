name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instala o ambiente fixado
        run: uv sync --frozen

      - name: A stack de gráficos não está instalada
        run: |
          if uv run python -c "import matplotlib" 2>/dev/null; then
            echo "matplotlib instalado no ambiente padrão (AD-015)."
            exit 1
          fi
          echo "ok — sem o grupo viz"

      - name: Round trip e o resto da suíte
        run: uv run pytest -q
